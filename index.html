        html {

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;

        /* Navigation */
        header {
            background-color: #9d8f76;
            padding: 1.5rem 5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-links {
            display: flex;
            gap: 2.5rem;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        /* Layout Structure */
        .section {
            padding: 4rem 10%;
        }
        h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
            text-align: center;
        }
        .underline {
            width: 70px;
            height: 3px;
            background: linear-gradient(to right, #8b6d51, #dcc4a9);
            margin: 0 auto 3rem auto;
            border-radius: 2px;
        }
        
        /* About Text */
        .about-text {

            margin: 0 auto;
            text-align: center;

            color: #4b5563;
            line-height: 1.8;
        }
