        header {

            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .nav-links {
            display: flex;
            gap: 2.5rem;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .nav-links a {
            color: #d1d5db;

        .nav-links a:hover {
            color: #a855f7; /* Purple on hover */
        }

        /* Layout Structure */
        .section {
            padding: 4.5rem 10%;
        }
        .bg-light {
            /* Alternating semi-transparent dark layer */
            background-color: rgba(15, 14, 20, 0.7);
            backdrop-filter: blur(5px);
        }
        h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            text-align: center;
        }
        .underline {
            width: 70px;
            height: 4px;
            background: linear-gradient(to right, #a855f7, #6366f1); /* Purple/Indigo gradient */
            margin: 0 auto 3rem auto;
            border-radius: 2px;
        }
        
        /* About Text */
        .about-text {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            font-size: 1.1rem;
            color: #d1d5db;
            line-height: 1.8;
        }

        /* Standard Cards Grid (For Education & Experience) */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2.5rem;
        }
        
        .card {
            background-color: #121016; /* Deep dark violet card base */
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2.5rem;

            transition: transform 0.2s, box-shadow 0.2s;
        }

            border-color: rgba(168, 85, 247, 0.3);
        }

            font-size: 1.3rem;
